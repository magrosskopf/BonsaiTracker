      <tspan x="86" dy="0">Pflege, Fotos und</tspan>
      <tspan x="86" dy="72">Fortschritt an einem Ort.</tspan>
    </text>
    <text x="86" y="410" font-family="'Trebuchet MS', Arial, sans-serif" font-size="28" fill="#3D5642">
