    <linearGradient id="card" x1="686" y1="123" x2="1010" y2="522" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBF8F0" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#EDF2E6" stop-opacity="0.94"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7E9E5D"/>
      <stop offset="1" stop-color="#5B7541"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" rx="28" fill="url(#bg)"/>
  <circle cx="220" cy="120" r="220" fill="url(#glowA)"/>
  <circle cx="1010" cy="528" r="250" fill="url(#glowB)"/>
  <path d="M107 463C153 402 239 377 331 391C441 407 510 481 605 481C682 481 745 434 809 382" stroke="#819F63" stroke-opacity="0.24" stroke-width="18" stroke-linecap="round"/>
  <path d="M118 516C166 466 238 450 320 459C400 467 464 516 554 516C610 516 666 495 726 457" stroke="#A98157" stroke-opacity="0.18" stroke-width="10" stroke-linecap="round"/>

  <g>
    <rect x="84" y="88" width="150" height="44" rx="22" fill="#EEF4E7" stroke="#D2DCC7"/>
    <text x="159" y="116" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="700" fill="#47653D">Vor dem Launch</text>
  </g>

  <g>
    <text x="86" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" letter-spacing="0.16em" fill="#58774A">BONSAI TRACKER</text>
