      <tspan x="788" dy="34">ohne Marketing-Overload.</tspan>
    </text>

    <rect x="788" y="328" width="284" height="72" rx="24" fill="#FFFCF6" stroke="#D6DECC"/>
    <text x="818" y="373" font-family="'Trebuchet MS', Arial, sans-serif" font-size="24" fill="#8A9488">du@example.com</text>

    <rect x="788" y="424" width="284" height="68" rx="24" fill="url(#accent)"/>
    <text x="930" y="467" text-anchor="middle" font-family="'Trebuchet MS', Arial, sans-serif" font-size="24" font-weight="700" fill="#F8F4EA">Jetzt auf die Warteliste</text>
  </g>
