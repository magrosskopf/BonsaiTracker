      <tspan x="86" dy="40">wann Bonsai Tracker offiziell live geht.</tspan>
    </text>
  </g>

  <g>
    <rect x="744" y="112" width="372" height="396" rx="34" fill="url(#card)" stroke="#D7DEC9"/>
    <text x="788" y="176" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700" letter-spacing="0.18em" fill="#58774A">WARTELISTE</text>
    <text x="788" y="230" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="#243729">Zum Launch informiert werden</text>
    <text x="788" y="282" font-family="'Trebuchet MS', Arial, sans-serif" font-size="22" fill="#536756">
