<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Bonsai Tracker Warteliste</title>
  <desc id="desc">Share preview fuer die Bonsai Tracker Warteliste.</desc>
  <defs>
    <linearGradient id="bg" x1="140" y1="50" x2="1070" y2="610" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F2E8"/>
      <stop offset="0.55" stop-color="#EEF2E6"/>
      <stop offset="1" stop-color="#E1E9D8"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(255 110) rotate(41.5) scale(280 240)">
      <stop stop-color="#B6C991" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#B6C991" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1020 520) rotate(180) scale(320 260)">
      <stop stop-color="#C3A56D" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#C3A56D" stop-opacity="0"/>
